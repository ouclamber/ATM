name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - rid: win-x64
            artifact: Bankomat-win-x64
          - rid: linux-x64
            artifact: Bankomat-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Show version
        run: echo "Building version ${{ steps.version.outputs.VERSION }}"

      - name: Restore with runtime
        run: dotnet restore Bankomat/Bankomat.csproj --runtime ${{ matrix.rid }}

      - name: Publish self-contained
        run: |
          dotnet publish Bankomat/Bankomat.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --no-restore \
            -p:PublishSingleFile=true \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -o publish/${{ matrix.artifact }}

      - name: Create zip
        run: |
          cd publish
          zip -r ../${{ matrix.artifact }}-${{ steps.version.outputs.VERSION }}.zip ${{ matrix.artifact }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ steps.version.outputs.VERSION }}
          path: ${{ matrix.artifact }}-${{ steps.version.outputs.VERSION }}.zip

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'Bankomat-*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
