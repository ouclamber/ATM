# PostgreSQL для локального запуска банкомата.
#   docker compose up -d      — запустить
#   docker compose down       — остановить (данные сохраняются в volume)
#   docker compose down -v    — остановить и удалить данные
services:
  postgres:
    image: postgres:16-alpine
    container_name: atm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ATM
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ATM"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  atm-pgdata:
